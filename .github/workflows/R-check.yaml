name: R package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Build and check study package
        run: |
          R CMD build kidneyAgeBench
          R CMD check --no-manual kidneyAgeBench_0.2.0.tar.gz
          R CMD INSTALL kidneyAgeBench_0.2.0.tar.gz
          Rscript examples/quick_start.R
          Rscript tests/check_supported_configurations.R
